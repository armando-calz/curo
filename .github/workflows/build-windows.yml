name: Build Windows (demo)

# Builds the public DEMO installer: development license secret, fictitious clinic.
# Client builds are made locally with the client's own buildSecrets.ts and delivered
# privately — never here, because workflow artifacts of a public repo are downloadable
# by any GitHub user.

on:
  push:
    tags:
      - 'v*'        # Se activa al crear un tag: v1.0.0, v1.2.3, etc.
  workflow_dispatch: # También permite ejecutarlo manualmente desde GitHub

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Use demo secrets
        run: cp src/main/license/buildSecrets.demo.ts src/main/license/buildSecrets.ts

      - name: Build app + generate icons
        run: npm run build

      - name: Package demo installer
        run: npx electron-builder --win --x64 --publish never -c.artifactName='Curo-Demo-Setup-${version}.${ext}'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: curo-demo-windows-installer
          path: release/Curo-Demo-Setup-*.exe
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Curo-Demo-Setup-*.exe
          generate_release_notes: true
