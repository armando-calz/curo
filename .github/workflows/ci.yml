name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Scripts skipped: tests and type checks need neither the Electron binary nor native rebuilds
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Use demo secrets
        run: cp src/main/license/buildSecrets.demo.ts src/main/license/buildSecrets.ts

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
